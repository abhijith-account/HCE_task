name: Zephyr Firmware CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

env:
  # Zephyr version that west.yml must resolve to. Keep in sync with west.yml.
  EXPECTED_ZEPHYR_VERSION: "4.4.0"

jobs:
  build-test-qemu:
    runs-on: ubuntu-latest
    # CHANGE (optional but recommended): replace ":latest" with a fixed CI image tag/digest
    # whose bundled Zephyr SDK matches what Zephyr 4.4.0 requires
    # (see SDK_VERSION in the zephyr repo at tag v4.4.0).
    container: zephyrprojectrtos/ci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize Zephyr workspace
        run: |
          west init -l .
          west update
          west zephyr-export

          SDK_DIR=$(ls -d /opt/toolchains/zephyr-sdk-* | head -n 1)
          echo "Using Zephyr SDK: $SDK_DIR"
          $SDK_DIR/setup.sh -c

      # NEW: fail fast if west.yml does not resolve to the expected Zephyr version
      - name: Verify pinned Zephyr version
        run: |
          ZEPHYR_DIR="$(west topdir)/zephyr"
          west list zephyr
          cat "$ZEPHYR_DIR/VERSION"

          MAJOR=$(awk -F' = ' '/^VERSION_MAJOR/ {print $2}' "$ZEPHYR_DIR/VERSION")
          MINOR=$(awk -F' = ' '/^VERSION_MINOR/ {print $2}' "$ZEPHYR_DIR/VERSION")
          PATCH=$(awk -F' = ' '/^PATCHLEVEL/ {print $2}' "$ZEPHYR_DIR/VERSION")
          ACTUAL="$MAJOR.$MINOR.$PATCH"

          echo "Expected Zephyr: $EXPECTED_ZEPHYR_VERSION, actual:$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_ZEPHYR_VERSION" ]; then
            echo "::error::Zephyr version mismatch. Check 'revision' in west.yml."
            exit 1
          fi

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-arm \
            cmake \
            make \
            gcc \
            g++ \
            lcov \
            gcovr \
            cppcheck \
            clang-tidy \
            libgtest-dev \
            binutils

      - name: Run Static Analysis (cppcheck)
        run: |
          cppcheck --enable=warning \
            --error-exitcode=1 \
            --std=c++20 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --suppress=unmatchedSuppression \
            --suppress=syntaxError \
            --suppress=unknownMacro \
            -DIS_TEST_ENVIRONMENT \
            -DCONFIG_BOARD_MPS2_AN386 \
            -I tests/mocks/include \
            -I include \
            -I include/Power_Management_System \
            -I include/RTOS_Command_based_thread_system \
            -I include/Smart_Battery_System \
            -i src/qemu_sensor_mocks.c \
            src/

      - name: Cross Compile for STM32 ARM - nucleo_f446re
        run: |
          west build -b nucleo_f446re . \
            --build-dir build_nucleo \
            --pristine

          echo ""
          echo "===== VERIFYING RESOLVED ZEPHYR .config SAFETY CLAIMS ====="
          grep -q "^CONFIG_HEAP_MEM_POOL_SIZE=0$" build_nucleo/zephyr/.config
          grep -q "^CONFIG_STACK_CANARIES=y$" build_nucleo/zephyr/.config
          grep -q "^CONFIG_ARM_MPU=y$" build_nucleo/zephyr/.config
          grep -q "^CONFIG_HW_STACK_PROTECTION=y$" build_nucleo/zephyr/.config

          echo ""
          echo "===== NUCLEO BUILD IMAGE ====="
          ls -lh build_nucleo/zephyr/zephyr.elf
          ls -lh build_nucleo/zephyr/zephyr.bin
          ls -lh build_nucleo/zephyr/zephyr.map

      - name: Emulation Test via QEMU (Cortex-M4)
        run: |
          # 1. Compile the firmware with explicit build dir
          west build -b mps2/an386 . --build-dir build_mps2 --pristine

          # 2. Initialize the full artifact report file
          echo "# Cortex-M4 Emulation Full Runtime Report" > qemu_m4_report.md
          echo '```text' >> qemu_m4_report.md

          # 3. Execute the emulator targeting the specific build dir
          timeout 120s west build -d build_mps2 -t run >> qemu_m4_report.md 2>&1 || EXIT_CODE=$?
          echo '```' >> qemu_m4_report.md

          # 4. Report non-timeout crashes immediately; pass banner is emitted only after QEMU_TEST_COMPLETE and all milestones pass
          if [ "${EXIT_CODE:-0}" -ne 124 ] && [ "${EXIT_CODE:-0}" -ne 0 ]; then
            echo "## Cortex-M4 QEMU Test FAILED (exit code $EXIT_CODE)!" >> $GITHUB_STEP_SUMMARY
          fi

          echo "**Note:** The full execution log was ~25MB due to continuous RTOS loop output and exceeded GitHub's 1MB display limit." >> $GITHUB_STEP_SUMMARY
          echo "Please download the **QEMU-M4-Execution-Report** from the Artifacts menu to view the complete boot sequence." >> $GITHUB_STEP_SUMMARY
          echo "### Final Output Snippet (Last 50 Lines):" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 50 qemu_m4_report.md >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # 5. Evaluate the QEMU exit code (124 means it successfully ran until timeout)
          if [ "${EXIT_CODE:-0}" -ne 124 ] && [ "${EXIT_CODE:-0}" -ne 0 ]; then
            echo "::error::Firmware crashed with exit code $EXIT_CODE!"
            exit 1
          fi

          echo "Verifying QEMU runtime milestones in qemu_m4_report.md..."
          for milestone in \
            "Command-Based RTOS Booting" \
            "FCB Configuration Store Mounted Successfully" \
            "1,000 Write-Cycle Endurance Test passed" \
            "System transitioned :0->1" \
            "Entering PM_STATE_ACTIVE" \
            "BME280 ROM Calibration Loaded Successfully" \
            "LPS22HB Initialized Successfully" \
            "PAV3015 Initialized Successfully" \
            "BATTERY STATUS" \
            "Rendered Heart Rate" \
            "Thread Stack Watermarks" \
            "Executing Exponential Backoff Retry" \
            "Falling back to Last-known-Good data" \
            "degraded=1" \
            "SAFE_HALT" \
            "Entering PM_STATE_SUSPEND_TO_IDLE" \
            "entering simulated STOP state" \
            "STOP WAKE: TIMER" \
            "QEMU_TEST_COMPLETE"; do
            if ! grep -q "$milestone" qemu_m4_report.md; then
              echo "::error::Missing required QEMU runtime milestone: $milestone"
              exit 1
            fi
            echo "  [OK] $milestone"
          done
          echo "All QEMU runtime milestones verified!"
          echo "## Cortex-M4 QEMU Test Passed (All Milestones & QEMU_TEST_COMPLETE Verified)!" >> $GITHUB_STEP_SUMMARY

      - name: Upload QEMU M4 Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: QEMU-M4-Execution-Report
          path: qemu_m4_report.md
          if-no-files-found: error

      - name: Upload QEMU execution logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: QEMU-Execution-Logs
          path: |
            build_nucleo/zephyr/zephyr.map
            build_nucleo/zephyr/zephyr.dts
            build_nucleo/zephyr/.config
            build_mps2/zephyr/zephyr.map
            build_mps2/zephyr/zephyr.dts
            build_mps2/zephyr/.config
          if-no-files-found: ignore

      - name: Build and run host unit tests
        run: |
          mkdir -p tests/build
          cd tests/build
          cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ..
          make -j$(nproc)
          ./run_pm_tests
          ./run_usb_shell_tests
          ./run_battery_tests
          ./run_static_memory_tests
          ./run_config_tests
          ./run_i2c_faults_tests
          ./run_state_machine_tests
          ./run_sync_tests
          ./run_command_tests

      - name: "Run clang-tidy (MISRA-C++ subset - M5-0, M8-5, M15-0)"
        run: |
          clang-tidy --version
          mkdir -p tests/build/tidy_db
          sed 's/-fprofile-update=atomic//g' \
            tests/build/compile_commands.json > tests/build/tidy_db/compile_commands.json

          python3 -c '
          import json, subprocess, sys
          db = json.load(open("tests/build/tidy_db/compile_commands.json"))
          files = sorted({e["file"] for e in db if "/src/" in e["file"] and e["file"].endswith(".cpp")})
          if not files:
              print("::error::No C++ source files found in compile_commands.json", file=sys.stderr)
              sys.exit(1)
          print(f"Running clang-tidy on {len(files)} source files...", flush=True)
          cmd = [
              "clang-tidy",
              "-p", "tests/build/tidy_db",
              "--config-file=.clang-tidy",
              "--extra-arg=-Wno-unknown-warning-option",
              *files,
          ]
          sys.exit(subprocess.run(cmd).returncode)

      - name: Enforce coverage
        run: |
          if [ -f ./scripts/check_coverage.sh ]; then
            chmod +x ./scripts/check_coverage.sh
            ./scripts/check_coverage.sh
          else
            echo "Coverage script not found. Skipping coverage enforcement."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Coverage-Dashboard
          path: coverage_report/
          if-no-files-found: ignore

      - name: Upload Nucleo Artifacts for Deployment
        uses: actions/upload-artifact@v7
        with:
          name: Nucleo-Firmware
          path: |
            build_nucleo/zephyr/zephyr.elf
            build_nucleo/zephyr/zephyr.hex
            build_nucleo/zephyr/zephyr.bin
