# boards/qemu_cortex_m3.conf

# 1. Simulated Flash and NVS
CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# 2. General Subsystems
CONFIG_REBOOT=y
CONFIG_COUNTER=y
CONFIG_I2C=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_WATCHDOG=y

# 3. Standard Console & C++ (Required for QEMU output)
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=768
CONFIG_ISR_STACK_SIZE=512
CONFIG_SHELL_STACK_SIZE=512
CONFIG_IDLE_STACK_SIZE=128
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y
CONFIG_ADC_EMUL=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_SIMULATOR_UNALIGNED_READ=y
CONFIG_INA226=y
CONFIG_SEMIHOST=y
CONFIG_PERCEPIO_TRACERECORDER=y
CONFIG_PERCEPIO_TRC_CFG_STREAM_PORT_RTT=n
CONFIG_PERCEPIO_TRC_CFG_STREAM_PORT_RINGBUFFER=y

CONFIG_LOG_BACKEND_XTENSA_SIM=n 
CONFIG_LOG_TIMESTAMP_64BIT=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=n
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=384
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
